name: DIAG2 (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, Windows, iis-propertymanager]
    steps:
      - name: Dump and repair IIS state
        shell: powershell
        run: |
          Import-Module WebAdministration
          $out = 'C:\Users\User\pmfl-iis-diag2.txt'
          $lines = @()
          foreach ($name in @('PropertyManagerFL.Api', 'PropertyManagerFL.UI')) {
            $lines += "=== $name (antes) ==="
            $lines += "site: $((Get-Website -Name $name).State)"
            $lines += "pool: $((Get-WebAppPoolState -Name $name).Value)"
            try {
              if ((Get-WebAppPoolState -Name $name).Value -ne 'Started') {
                Start-WebAppPool -Name $name -ErrorAction Stop
                Start-Sleep -Seconds 3
              }
              if ((Get-Website -Name $name).State -ne 'Started') {
                Start-Website -Name $name -ErrorAction Stop
              }
            } catch {
              $lines += "ERRO: $($_.Exception.Message)"
            }
            $lines += "=== $name (depois) ==="
            $lines += "site: $((Get-Website -Name $name).State)"
            $lines += "pool: $((Get-WebAppPoolState -Name $name).Value)"
          }
          Set-Content -Path $out -Value ($lines -join "`n") -Encoding UTF8
          Get-Content $out
