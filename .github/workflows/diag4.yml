name: DIAG4 (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, Windows, iis-propertymanager]
    steps:
      - name: Dump w3wp processes and DLL holders
        shell: powershell
        run: |
          $out = 'C:\Users\User\pmfl-w3wp.txt'
          $lines = @()
          $lines += '=== W3WP COMMAND LINES ==='
          $lines += (Get-CimInstance Win32_Process -Filter "Name='w3wp.exe'" | Select-Object ProcessId, CommandLine | Format-List | Out-String)
          $lines += '=== TASKLIST /M Microsoft.Data.SqlClient.dll ==='
          $lines += (tasklist /m Microsoft.Data.SqlClient.dll | Out-String)
          $lines += '=== APP POOLS ==='
          $lines += (Get-WebAppPoolState | Select-Object -Property itemname, value | Format-Table -AutoSize | Out-String)
          Set-Content -Path $out -Value ($lines -join "`n") -Encoding UTF8
          Write-Host "Wrote $out"
